  더블클릭으로 열어도(파일:// 프로토콜) 바로 동작합니다.

  변환 내용:
    - 원래 이 화면은 Claude Design 전용 런타임(DCLogic 베이스 클래스와
      <x-dc>, sc-if, sc-for, sc-camel-on-*, {{ }} 문법)을 사용했는데,

    - 그래서 그 마크업을 실제 React.createElement 호출 트리로 변환하고
      (sc-if → 삼항 조건, sc-for → .map, sc-camel-on-* → onClick/onChange 등),
      Component 클래스가 DCLogic 대신 React.Component를 상속하도록
      바꿨습니다. state, 이벤트 핸들러, renderVals()(상태→화면 데이터 매핑
      함수) 등 나머지 로직은 원본과 동일합니다.
    - React로 다시 포팅하실 때는 render() 안의 h(...) 호출들을 JSX로
      바꾸시면 되고, 나머지 클래스 로직은 그대로 옮기시면 됩니다.

  참고: 폰트(@font-face)는 원래 압축된 폰트 바이너리를 참조하고 있어

-->

<script>


function parseStyle(str) {
  const out = {};
  if (!str) return out;
  String(str).split(';').forEach(decl => {
    const idx = decl.indexOf(':');
    if (idx === -1) return;
    let prop = decl.slice(0, idx).trim();
    let val = decl.slice(idx + 1).trim();
    if (!prop || !val) return;
    if (!prop.startsWith('--')) {
      prop = prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    }
    out[prop] = val;
  });
  return out;
}

function h(type, props, ...children) {
  const finalProps = {};
  if (props) {
    for (const k in props) {
      if (k === 'style' && typeof props[k] === 'string') {
        finalProps.style = parseStyle(props[k]);
      } else {
        finalProps[k] = props[k];
      }
    }
  }
  return React.createElement(type, finalProps, ...children);
}

서\n다시 물어보게 되는 점이 묘미다.\n너무 자주 쓰면 오히려 효과가 떨어질 수 있으니\n적재적소에 잘 활용하는 눈치는 조금 필요하다.\n어디서든 써먹을 수 있는 만능 밈이다.\n100초, 100원, 100kg 어떤 단위에도 붙일 수 있다.\n친구를 킹 받게 하고 싶은 상황만 잘 노려보자.\n이미 응용력을 갖춘 사람들이 속출하고 있어\n원작자 순호가 명예의 전당까지 발표한 상태.\n이런 사람 100명 넘겠지?\n명예의 전당 분석으로 알게 된 건,\n맥락 없이 붙이는 것도 좋은 꿀팁이다.\n그냥 100 써먹을 수 있는 곳에는 다 가져와 보자.\n꺼드럭대는 거랑 다르게 킹 받는 밈이다.\n꺼드럭과 100드립을 왔다 갔다 하면\n킹받음 1인자가 될 수 있을 것 같다.\n그런 의미에서 꺼드럭 짤 준비했다.", "image": "images/meme-13.jpg"}, "~를 무례하지 않게 말해 주세요": {"cat": "미분류", "hue": 236, "tags": "", "origin": "함부로 누군가의 신체 특징을 언급하거나 결과물을 평가하는 건 실례잖아요. 그래서 이걸 무례하지 않게 돌려 말해달라고 요청하는 릴스 형식 이 밈으로 떠올랐어요. 특히 ‘까맣다를 무례하지 않게 말해주세요’라는 자막을 단 곽범의 영상 이 대표적인데요. 여러 댓글이 이어졌지만, 그중 ‘여름이 널 아주 사랑했나 보다’라는 낭만 넘치는 댓글이 달리면서 2차로 크게 바이럴 됐어요. 다소 짓궂게 느껴질 수 있는 소재를 유쾌하게 콘텐츠화하면서도 댓글 반응까지 유도할 수 있다 는 게 이 밈의 특징입니다.", "image": "images/meme-14.jpg"}, "삐에로 밈": {"cat": "미분류", "hue": 161, "tags": "", "origin": "최근 갑작스레 삐에로 붐이 일고 있어요. 이는 ‘삐에로 남친이랑 결혼할 수 있어?’라는 고민 글에서 시작했습니다. 글쓴이는 자신의 상황을 설명할 때 어떤 특징이 있는 삐에로를 ‘OO삐’라고 줄여 불렀는데요. 선배 삐에로는 ‘선배삐’, 잘 나가는 삐에로는 ‘개대박삐’, 삐에로마다 다르다는 뜻으로 사람 바이 사람을 변형한 ‘삐바삐’ 라는 식이죠. 이 표현이 웃긴다는 반응을 얻으며 ‘OO삐’ 호칭 자체가 하나의 유행이 됐어요.\n여기서 그치지 않고 삐에로 출신 연예인 까지 새롭게 주목받았어요. 이용주, 이은지, 허경환, 윤경호처럼 능력 있는 방송인 중에 ‘삐출(삐에로 출신)’이 많다는 사실 이 바이럴 됐거든요. 이외로 삐에로의 최종 버전이 ‘ 품바 ‘라며 네임드 품바 ‘버드리’ 영상 이 엑스에서 공유되는 등 삐에로 직업의 다양한 부분이 화제랍니다.", "image": "images/meme-15.jpg"}, "연락없네잘살아": {"cat": "미분류", "hue": 228, "tags": "", "origin": "블라인드에 올라온 글 하나가 화제가 되었다.\n애인이 연락이 안 된다는 글인데…\n37분째 카톡을 답을 안 하는 연인에게\n‘연락없네 잘 살아’라고 보내도 되는지\n우리 끝장 토론 해보자.\n답은 없겠지만,\n덕분에 새로운 밈이 탄생하였다.\n어떤 상황이든, 그냥 시간 + 연락없네 + 잘 살아를 쓰면 되는 단순한 밈이다.\n뭔가 투정을 부리고 싶을 때,\n연락이나 답장을 기다리고 있을 때,\n빨리 결과를 보고 싶을 때\n언제든 꺼내서 쓸 수 있는 밈이다.", "image": "images/meme-16.jpg"}, "측측측면샷": {"cat": "미분류", "hue": 36, "tags": "", "origin": "관자놀이쯤에서 사진을 촬영하는 기법이 화제다.\n지난 7월,\n인스타그래머 @oliviathornton가\n오른쪽 사진을 찍는 과정과 결과를\n릴스로 만들어서 업로드 했고\n무려 1,740만 조회수를 달성했다!\n0.5배 줌으로 설정한 뒤,\n눈썹 옆에서 사진을 촬영하는 것인데,\n사진이 예상치 못할 정도로 웃기게 나오면서 밈처럼 활용되는 중!\n릴스를 올릴 때 쓴 음원 창에 들어가 보면,\n이 구도의 릴스로 가득한 것을 확인할 수 있었다!\n사진을 찍힌 주인공 @live_like_lando 는\n본인의 인스타그램 프로필 사진을\n이 사진으로 바꾸고, 고정 게시글로 등록했다!\n제법 마음에 들었나 보다!\n한 매거진에서 이 각도로 촬영한 사진을\n‘측측측면샷’이라고 소개한 이후로\n이 각도로 찍은 사진의 공식적인 명칭이 된 것 같다.\n블로그 내용에도 자주 등장할 만큼\n일상에 스며든 ‘측측측면샷’, ‘측측측면짤’…!\n이 정도면 신조어 맞는 것 같다.", "image": "images/meme-17.jpg"}, "일하기전제모습이고요": {"cat": "미분류", "hue": 5, "tags": "", "origin": "일하기 전 비포&애프터 영상이 화제다.\n일이 얼마나 힘들면 힘들다고…\n라고 말하는 트둥이들을 위해\n바로 애프터도 가져온다.\n웃을 일이 아니다…\n출근하고 퇴근한 나의 모습을 본 것 같은 이 기분.\n시작하는 시간때는 눈도 초롱초롱한데,\n일이 끝나자마자 다들 기력 -100 상태가 되는게 킬포다.\n어떤 일이든, 힘들지 않은 일이 없다는\n냉혹한 현실을 알게 해주는 밈이기도 하다.", "image": "images/meme-18.jpg"}, "모르는개산책": {"cat": "미분류", "hue": 28, "tags": "", "origin": "‘모르는 게 상책’이란 속담이 있다.\n말 그대로 모르는 게 마음이 편할 때가 있다는\n선조의 지혜가 담긴 말인데,\n이제 우리는 이걸 ‘모르는 개 산책’으로\n바꿔서 사용하기로 했다.\n말 그대로 모르는 개를 만날 떄\n사용할 수 있는 밈이다.\n둘 중 무엇을 선택할지 흥미진진한\n밸런스 게임도 이뤄지고 있는 중이다.\n트둥이들의 선택은?\n시간이 좀 지나긴 했지만\n적재도 참전한 해당 밸런스 게임.\n이제는 클래식한 밈이 되어\n강아지가 등장하는 최신 콘텐츠의\n제목으로 활용되는 중이다.\n야구 경기장에서도 모르는 개(?)\n산책이 이뤄지고 있는 요즘.\n이 밈의 붐은 다시 오는 중~", "image": "images/meme-19.jpg"}, "장투교": {"cat": "미분류", "hue": 14, "tags": "", "origin": "‘장투교’ 는 SBS공채 개그맨 정승우의 부캐\n‘최병욱 전도사’가 전도하는 가상의 종교다.\n꽤 오랜 시간 투자를 했다는 정승우는\n원래 계정에 투자 관련 릴스를 꾸준히 올렸었다.\n존버 투자가 아닌 진짜 장기 투자자로\n투자에 대한 지식이 해박한 것을 알 수 있다.\n7월 본격적인 코스피 하락장이 시작되면서\n삼성전자 하이닉스 주주들과 함께\n울고 웃는 영상들이 많이 업로드 되었는데\n본격적인 종목 기도회 이후로\n계정이 말 그대로 떡상 했다.\n말투가 진짜 목사님 같은 것도 웃긴데\n내용 하나하나 너무 공감이 되어서\n눈물 없인 들을 수 없는 수준이다.\n폭락장에 긴급 기도회를 열어\n모든 주주들의 마음을 다독이고 있는 장투교.\n본업으로 돌아가서 운동으로 땀 흘릴 수 있길..롱멘..\n주식 상승을 기원하며\n늘 빨간 넥타이만 매고 있는 최병욱 전도사.\n그저 원금만 찾게 해주시옵소서..", "image": "images/meme-20.jpg"}, "니가 좋아": {"cat": "미분류", "hue": 139, "tags": "", "origin": "이 밈은 6월 개봉 영화 < 와일드 씽 >에서 시작됐어요. 배우 오정세가 맡은 최성곤 캐릭터가 부른 솔로곡 ‘니가 좋아’의 뮤직비디오 가 공개되며 큰 화제를 모았는데요. 공개 이후 조회수 251만 회를 돌파하며 폭발적인 관심을 받았죠. 이 뮤비는 진지한 듯하면서도 어딘가 과하고, 촌스러운 듯하면서도 묘하게 세련된 분위기가 공존해요. 자꾸만 귀에 맴도는 중독성 강한 멜로디까지 더해져 “수능 금지곡 아니냐”는 반응까지 나오고 있어요. 이후 ‘니가 좋아’ 노래에 맞춰 립싱크를 하는 챌린지가 SNS를 중심으로 빠르게 확산되며 수많은 연예인 들이 참여해 화제를 키우는 중입니다.", "image": "images/meme-21.jpg"}, "난 파라파라나 추고 있어야겠다 오이데~": {"cat": "미분류", "hue": 207, "tags": "", "origin": "‘ 거제야호~ ‘에 이어 리센느 미나미가 또 하나의 밈을 탄생시켰습니다. 바로 ‘난 파라파라나 추고 있어야겠다 / 오이데~’인데요! 이 밈도 리센느 멤버 원이의 유튜브 콘텐츠에서 시작됐어요. 원이가 바다에서 물고기를 잡는 동안 뒤에 있던 미나미가 갑자기 “파라파라나 추고 있어야겠다”라고 말하며 춤을 추기 시작한 장면이 화제가 됐거든요. 파라파라는 일본에서 유행하던 댄스로, 무심한 표정과 반복되는 손동작이 포인트 예요. 이어 물고기를 향해 “오이데(이리와)~”를 외치며 물고기를 응원(?)하는 모습까지 이용자의 웃음을 자아내며 빠르게 확산됐죠.", "image": "images/meme-22.jpg"}, "띠로리 대신 띠로리리~↘": {"cat": "미분류", "hue": 226, "tags": "", "origin": "최근 음악으로 웃음을 주는 콘텐츠가 또 하나 등장했어요. 지난달에는 모든 노래를 싸이의 ‘강남스타일’로 리믹스하는 콘텐츠 가 화제를 모았는데요. 이번에는 아이돌 그룹 미야오의 노래 ‘ 띠로리 ‘가 새로운 밈의 주인공이 됐습니다. 원곡 ‘띠로리’는 바흐의 곡을 샘플링한 노래로, 중독성 있는 “띠로리~” 가사가 특징인데요. 한 크리에이터 가 “바흐 대신 베토벤이 나섰다면?”이라는 자막과 함께 해당 곡을 다른 클래식 음악들로 리믹스한 영상 을 올리며 많은 관심을 받았어요. 영상에서는 베토벤뿐 아니라 모차르트, 비발디 등 다양한 클래식 음악이 차례로 등장하는데요. 원곡과 전혀 다른 음악인데도 묘하게 잘 어울린다는 점이 웃음 포인트였죠.\n댓글에서는 “비발디 버전은 진짜 원곡 같다”, “생각보다 너무 잘 어울린다” 같은 반응이 이어졌고요. 이처럼 익숙한 음악을 새롭게 재해석하는 콘텐츠 가 다시 한번 큰 화제를 모으며 리믹스 밈의 인기를 이어가는 중이에요.", "image": "images/meme-23.jpg"}, "디오 주간": {"cat": "미분류", "hue": 156, "tags": "", "origin": "매년 6월만 되면 어김없이 타임라인에 등장하는 밈이 있어요. 바로 ‘디오 주간’인데요! 디오주간은 아이돌 그룹 엑소 디오가 2017년 발매된 앨범 속 주간 일기에 쓴 기록이에요. 앨범 속에는 6월 15일부터 6월 21일까지의 일상이 짧은 문장으로 기록 되어 있는데요. 6월 15일은 “고된 하루”, 16일은 “정신적 스트레스”, 17일은 “긴 하루”처럼 짧고 담백한 표현들로 채워져 있어요. 디오가 묘사한 일상이 너무나 우리의 현실이라 매년 이맘때쯤 화제가 되곤 했죠.\n이제는 6월이 되면 “ 디오주간 버티기 챌린지 “, “ 디오주간 시작하자마자 하루가 힘들다 ” 같은 게시물이 올라오는 것이 하나의 연례행사처럼 자리 잡았어요. 올해도 SNS에서는 디오 주간이 시작됐다며 여러 글이 이어지며 많은 이용자의 공감을 얻고 있어요.", "image": "images/meme-24.jpg"}, "천연 위고비": {"cat": "미분류", "hue": 359, "tags": "", "origin": "천연 위고비는 계란과 올리브오일, 후추를 조합한 레시피에서 시작됐는데요. 한 우창윤 내과 의사가 소개한 식단 이 온라인에서 화제가 되며 “천연 위고비”라는 이름이 붙었어요. 일부 전문가들이 해당 조합이 포만감을 높이는 데 도움이 될 수 있다고 언급하면서 SNS에는 직접 만들어 먹어 본 후기 콘텐츠 가 쏟아지기 시작했죠.\n하지만 사람들은 단순히 레시피를 따라 하는 데서 그치지 않고 치즈 를 넣거나 빵 을 곁들이면서 자신만의 ‘천연 위고비’ 를 만들기 시작했어요. 원래는 식단 레시피였지만 점차 맛있는 요리를 만드는 놀이 콘텐츠로 변한 셈이죠. 이후 이것이 확대되어 어떤 음식이든 ‘천연 위고비’라는 이름을 붙이기 시작했는데요. 치킨 , 피자 , 디저트 는 물론이고 보기만 해도 고칼로리인 음식까지 ‘천연 위고비’라는 제목으로 올라와 웃음을 자아냈죠.", "image": "images/meme-25.jpg"}};

const VIEW_LABELS = ['정면', '좌측면', '우측면', '뒷면'];

const BASE_PLAN = [
  { n: 1, line: '캐릭터가 가게 문을 열며 손님에게 인사한다.', short: '인사' },
  { n: 2, line: '갓 구운 소금빵을 두 손으로 내밀며 소개한다.', short: '갓 구운 빵' },
  { n: 3, line: '한 입 베어 문 손님이 눈이 번쩍 뜨이는 리액션.', short: '리액션' },
  { n: 4, line: '가게 이름·위치·영업시간이 적힌 간판 컷으로 마무리.', short: '마무리' }
];

const pad2 = n => String(n).padStart(2, '0');
const isoDay = (dayOffset = 0) => { const d = new Date(); d.setDate(d.getDate() + dayOffset); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtDay = (iso) => { const p = (iso || '').split('-'); return p.length === 3 ? `${Number(p[1])}/${Number(p[2])}` : (iso || ''); };
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const dayFrom = (text) => {
  const t = text || '';
  if (/그저께|그제/.test(t)) return isoDay(-2);
  if (/어제/.test(t)) return isoDay(-1);
  const m = t.match(/(\d{1,2})\s*[\/\-월\.]\s*(\d{1,2})/);
  if (m) { const d = new Date(); return `${d.getFullYear()}-${pad2(Number(m[1]))}-${pad2(Number(m[2]))}`; }
  return isoDay(0);
};
const timeFrom = (text) => {
  const m = (text || '').match(/(\d{1,2})\s*(?::|시)\s*(\d{1,2})?/);
  if (!m) return nowHM();
  return `${pad2(Number(m[1]))}:${pad2(Number(m[2] || 0))}`;
};




class Component extends React.Component {
  constructor(props) {
    super(props);
    const seeded = props.preseed !== false;
    this.state = {
      screen: 'home',
      stack: [],
      toast: '',
      storeSaved: seeded,
      storeReadOnly: seeded,
      storeCategory: seeded ? '베이커리' : '베이커리',
      storeAddress: seeded ? '서울 마포구 연남로 21' : '',
      storeHours: seeded ? '08:00 – 20:00, 월 휴무' : '',
      storeDesc: seeded ? '매일 새벽 반죽해 오븐에서 바로 꺼내는 동네 빵집. 소금빵과 통밀 캄파뉴가 간판이에요.' : '',
      storeImages: seeded
        ? [{ label: '소금빵', hue: 38 }, { label: '오늘 구운 빵 진열대', hue: 26 }]
        : [],
      charName: '', charAge: '', charGender: '', charHobby: '', charLook: '', hobbyHint: false,
      charMsgs: [{ role: 'ai', kind: 'text', text: '어떤 마스코트를 원하세요? 가게 분위기나 느낌을 편하게 말해주세요.' }],
      charInput: '',
      charThinking: false,
      charTurn: 0,
      charCands: [],
      charSelected: -1,
      charViews: [],
      charConfirmed: false,
      charInfoReadOnly: true,
      adType: props.adTypeDefault || '인스타 게시물',
      adConcept: '유쾌함',
      trendPopup: false,
      trendApplied: false,
      trendPick: TRENDS[0],
      openTrend: '',
      memeFilter: '전체',
      memeSearch: '',
      memeSort: '급상승순',
      memePicker: true,
      memeSel: '',
      memeZoomOpen: false,
      fromAd: false,
      sbMsgs: [{ role: 'ai', kind: 'text', text: '어떤 이야기로 광고를 만들까요? 알리고 싶은 걸 말해주세요.' }],
      sbInput: '',
      sbThinking: false,
      sbTurn: 0,
      plan: [],
      comicCuts: [],
      myTab: 'history',
      history: [],
      items: seeded ? ['소금빵', '버터 크루아상', '통밀 캄파뉴'] : [],
      prods: seeded ? [
        { id: 3, name: '소금빵', qty: '60개', date: isoDay(0), time: '07:40', soldOut: '' },
        { id: 2, name: '버터 크루아상', qty: '40개', date: isoDay(-1), time: '13:20', soldOut: '' },
        { id: 1, name: '통밀 캄파뉴', qty: '12개', date: isoDay(-1), time: '06:50', soldOut: '16:10' }
      ] : [],
      newItem: '',
      draftItem: seeded ? '소금빵' : '',
      draftQty: '', draftDate: isoDay(0), draftTime: '', draftSold: '',
      notifOpen: false,
      sbProdOpen: false,
      sbSetOpen: false,
      pending: {},
      sbProdLogged: false,
      backupNote: '', backupErr: false
    };
  }

  charListRef = React.createRef();
  sbListRef = React.createRef();

  pinBottom(ref) {
    const el = ref && ref.current;
    if (!el) return;
    const run = () => {
      if (el.scrollTo) el.scrollTo({ top: el.scrollHeight, behavior: 'instant' });
      el.scrollTop = el.scrollHeight;
    };
    run();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
  }

  componentDidMount() {
    if (super.componentDidMount) super.componentDidMount();
    this.pinBottom(this.charListRef);
    this.pinBottom(this.sbListRef);
    this._onMemeZoomKeyDown = (e) => {
      if (e.key === 'Escape' && this.state.memeZoomOpen) this.setState({ memeZoomOpen: false });
    };
    window.addEventListener('keydown', this._onMemeZoomKeyDown);
  }

  componentWillUnmount() {
    if (super.componentWillUnmount) super.componentWillUnmount();
    window.removeEventListener('keydown', this._onMemeZoomKeyDown);
  }

  componentDidUpdate(prevProps, prevState) {
    if (super.componentDidUpdate) super.componentDidUpdate(prevProps, prevState);
    if (prevState.charMsgs.length !== this.state.charMsgs.length
      || prevState.charThinking !== this.state.charThinking
      || (prevState.screen !== this.state.screen && this.state.screen === 'char')) {
      this.pinBottom(this.charListRef);
    }
    if (prevState.sbMsgs.length !== this.state.sbMsgs.length
      || prevState.sbThinking !== this.state.sbThinking
      || (prevState.screen !== this.state.screen && this.state.screen === 'sb')) {
      this.pinBottom(this.sbListRef);
    }
  }

  toast(t) {
    clearTimeout(this._tt);
    this.setState({ toast: t });
    this._tt = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  go(screen) {
    this.setState(s => ({ screen, stack: [...s.stack, s.screen], trendPopup: false }));
  }

  back = () => {
    this.setState(s => {
      const st = [...s.stack];
      const prev = st.pop() || 'home';
      return { screen: prev, stack: st, trendPopup: false };
    });
  };

  /* ---------- store ---------- */
  addImage = () => this.setState(s => ({
    storeImages: [...s.storeImages, { label: `상품 ${s.storeImages.length + 1}`, hue: rnd() }]
  }));

  rerollStoreImage(i) {
    this.setState(s => ({
      storeImages: s.storeImages.map((im, k) => k === i ? { ...im, hue: rnd() } : im)
    }));
    this.toast('사진만 다시 생성했어요');
  }

  saveStore = () => {
    this.setState({ storeSaved: true, storeReadOnly: true });
    this.toast('가게 정보를 저장했어요 — 캐릭터 만들기가 열렸어요');
  };

  /* ---------- proposal + confirm ---------- */
  propose(which, kind, text, diffs, payload) {
    const pid = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
    const key = which === 'char' ? 'charMsgs' : 'sbMsgs';
    this.setState(s => ({
      charThinking: which === 'char' ? false : s.charThinking,
      sbThinking: which === 'char' ? s.sbThinking : false,
      charTurn: which === 'char' ? s.charTurn + 1 : s.charTurn,
      sbTurn: which === 'char' ? s.sbTurn : s.sbTurn + 1,
      pending: { ...s.pending, [pid]: { kind, diffs, payload, status: 'open' } },
      [key]: [...s[key], { role: 'ai', kind: 'text', text }, { role: 'ai', kind: 'confirm', pid }]
    }));
  }

  confirmPending(pid) {
    const p = this.state.pending[pid];
    if (!p || p.status !== 'open') return;
    const marked = s => ({ ...s.pending, [pid]: { ...s.pending[pid], status: 'applied' } });
    if (p.kind === 'plan') {
      this.setState(s => ({
        pending: marked(s), plan: p.payload.plan,
        sbMsgs: [...s.sbMsgs,
          { role: 'ai', kind: 'text', text: '반영했어요. 왼쪽 스토리에서 볼 수 있어요.' },
          { role: 'ai', kind: 'plan', ref: 'plan' }]
      }));
      this.toast('스토리를 반영했어요');
    } else if (p.kind === 'comic') {
      this.setState(s => ({
        pending: marked(s), comicCuts: p.payload.cuts,
        sbMsgs: [...s.sbMsgs, { role: 'ai', kind: 'comic', ref: 'comic' }]
      }));
      this.toast('네컷만화를 반영했어요');
    } else if (p.kind === 'char') {
      const tail = p.payload.cands
        ? [{ role: 'ai', kind: 'text', text: '반영했어요. 후보 그림도 뽑아뒀어요 — 하나 골라주세요.' }, { role: 'ai', kind: 'cands', ref: 'cands' }]
        : [{ role: 'ai', kind: 'text', text: '반영했어요. 4방향으로 확인해보세요.' }, { role: 'ai', kind: 'views', ref: 'views' }];
      this.setState(s => ({
        pending: marked(s), ...p.payload.fields,
        charViews: p.payload.views || s.charViews,
        charMsgs: [...s.charMsgs, ...tail]
      }));
      this.toast('캐릭터를 반영했어요');
    }
  }

  declinePending(pid) {
    const p = this.state.pending[pid];
    if (!p || p.status !== 'open') return;
    const key = p.kind === 'char' ? 'charMsgs' : 'sbMsgs';
    this.setState(s => ({
      pending: { ...s.pending, [pid]: { ...s.pending[pid], status: 'declined' } },
      [key]: [...s[key], { role: 'ai', kind: 'text', text: '그대로 둘게요. 어떻게 바꾸면 좋을지 말해주세요.' }]
    }));
  }

  /* ---------- export / import ---------- */
  exportData = () => {
    const s = this.state;
    const data = {
      app: 'ai-ad-proto', version: 1, exportedAt: new Date().toISOString(),
      store: {
        saved: s.storeSaved, category: s.storeCategory, address: s.storeAddress,
        hours: s.storeHours, desc: s.storeDesc, images: s.storeImages
      },
      character: {
        confirmed: s.charConfirmed, name: s.charName, age: s.charAge, gender: s.charGender,
        hobby: s.charHobby, look: s.charLook, cands: s.charCands, selected: s.charSelected, views: s.charViews
      },
      items: s.items, prods: s.prods, history: s.history,
      ad: { type: s.adType, concept: s.adConcept, trendApplied: s.trendApplied, trendPick: s.trendPick },
      comicCuts: s.comicCuts, plan: s.plan
    };
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ai-ad-백업-${isoDay(0)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      this.setState({ backupErr: false, backupNote: `${isoDay(0)} 백업 파일을 내보냈어요 — 광고 ${s.history.length}건 · 생산 기록 ${s.prods.length}건 포함` });
      this.toast('백업 파일을 내려받았어요');
    } catch (err) {
      this.setState({ backupErr: true, backupNote: '내보내기에 실패했어요. 브라우저 다운로드가 막혀 있지 않은지 확인해주세요.' });
      this.toast('내보내기에 실패했어요');
    }
  };

  importFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data = null;
      try { data = JSON.parse(reader.result); } catch (err) { data = null; }
      this.applyImport(data, file.name);
    };
    reader.onerror = () => {
      this.setState({ backupErr: true, backupNote: '파일을 읽지 못했어요. 다시 시도해주세요.' });
      this.toast('파일을 읽지 못했어요');
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  applyImport(d, fileName) {
    if (!d || d.app !== 'ai-ad-proto') {
      this.setState({ backupErr: true, backupNote: '이 앱에서 내보낸 백업 파일이 아니에요. 내보내기로 만든 JSON 파일을 골라주세요. (기존 내용은 그대로 있어요)' });
      this.toast('백업 파일 형식이 아니에요');
      return;
    }
    const st = d.store || {}, ch = d.character || {}, ad = d.ad || {};
    const arr = v => Array.isArray(v) ? v : [];
    this.setState({
      screen: 'my', stack: [], myTab: 'data', notifOpen: false, trendPopup: false, backupErr: false,
      storeSaved: st.saved !== false,
      storeCategory: st.category || '베이커리',
      storeAddress: st.address || '',
      storeHours: st.hours || '',
      storeDesc: st.desc || '',
      storeImages: arr(st.images),
      storeReadOnly: true,
      charConfirmed: !!ch.confirmed,
      charName: ch.name || '', charAge: ch.age || '', charGender: ch.gender || '',
      charHobby: ch.hobby || '', charLook: ch.look || '',
      charCands: arr(ch.cands), charSelected: typeof ch.selected === 'number' ? ch.selected : -1,
      charViews: arr(ch.views), charInfoReadOnly: true,
      items: arr(d.items),
      prods: arr(d.prods),
      history: arr(d.history),
      plan: arr(d.plan), comicCuts: arr(d.comicCuts),
      adType: ad.type || '인스타 게시물',
      adConcept: ad.concept || '유쾌함',
      trendApplied: !!ad.trendApplied,
      trendPick: ad.trendPick || TRENDS[0],
      backupNote: `${fileName || '백업 파일'}을 불러왔어요 — 광고 ${arr(d.history).length}건 · 생산 기록 ${arr(d.prods).length}건 · 품목 ${arr(d.items).length}개${d.exportedAt ? ` (내보낸 시점 ${String(d.exportedAt).slice(0, 10)})` : ''}. 대화 내용은 복원되지 않고 새로 시작해요.`
    });
    this.toast('백업을 불러왔어요 — 히스토리와 내 정보가 복원됐어요');
  }

  /* ---------- production records ---------- */
  patchProd(id, patch) {
    this.setState(s => ({ prods: s.prods.map(p => p.id === id ? { ...p, ...patch } : p) }));
  }
  setSoldOut(id, v) {
    this.patchProd(id, { soldOut: v });
    if (v) this.toast('매진 시각을 저장했어요');
  }
  delProd(id) {
    this.setState(s => ({ prods: s.prods.filter(p => p.id !== id) }));
    this.toast('생산 기록을 지웠어요');
  }
  addItem = () => {
    const n = this.state.newItem.trim();
    if (!n) { this.toast('품목 이름을 적어주세요'); return; }
    if (this.state.items.includes(n)) { this.toast('이미 있는 품목이에요'); return; }
    this.setState(s => ({ items: [...s.items, n], newItem: '', draftItem: s.draftItem || n }));
    this.toast(`'${n}' 품목을 추가했어요`);
  };
  renameItem(oldName, next) {
    const name = (next || '').trim();
    if (!name || name === oldName) return;
    this.setState(s => ({
      items: s.items.map(i => i === oldName ? name : i),
      prods: s.prods.map(p => p.name === oldName ? { ...p, name } : p),
      draftItem: s.draftItem === oldName ? name : s.draftItem
    }));
  }
  delItem(name) {
    this.setState(s => ({ items: s.items.filter(i => i !== name), draftItem: s.draftItem === name ? '' : s.draftItem }));
  }
  addProd = () => {
    const s = this.state;
    const name = s.draftItem || s.items[0];
    if (!name) { this.toast('품목을 먼저 추가해주세요'); return; }
    const hm = s.draftTime || nowHM();
    this.setState(st => ({
      prods: [{ id: Date.now(), name, qty: st.draftQty.trim(), date: st.draftDate || isoDay(0), time: hm, soldOut: st.draftSold }, ...st.prods],
      draftQty: '', draftTime: '', draftSold: ''
    }));
    this.toast(s.draftSold ? '생산 기록을 저장했어요' : '저장했어요 — 매진 시각은 나중에 입력하면 돼요');
  };
  itemFrom(text) {
    const t = text || '';
    const hit = this.state.items.find(i => t.includes(i));
    if (hit) return hit;
    const cleaned = t
      .replace(/\d+\s*(잔|개|세트|박스|병|kg|판)/g, ' ')
      .replace(/(생산했어요|생산함|생산|만들었어요|만듦|구웠어요|팔았어요|했어요|오늘|어제)/g, ' ')
      .replace(/[.,!?·]/g, ' ')
      .trim();
    return cleaned.split(/\s+/).filter(Boolean).slice(0, 3).join(' ') || '신규 품목';
  }
  qtyFrom(text) {
    const m = (text || '').match(/\d+\s*(잔|개|세트|박스|병|kg|판)/);
    return m ? m[0].replace(/\s+/g, '') : '';
  }

  /* ---------- character ---------- */
  makeCands() {
    return [0, 1, 2].map(i => ({ hue: rnd(), label: `후보 ${i + 1}` }));
  }
  makeViews() {
    const base = rnd();
    return VIEW_LABELS.map((l, i) => ({ label: l, hue: (base + i * 14) % 360 }));
  }

  genCandidates = () => {
    const cands = this.makeCands();
    this.setState(s => ({
      charCands: cands, charSelected: -1,
      charMsgs: [...s.charMsgs, { role: 'ai', kind: 'cands', ref: 'cands' }]
    }));
  };

  aiChar(userText) {
    const t = this.state.charTurn;
    this.setState({ charThinking: true });
    setTimeout(() => {
      const s = this.state;
      if (t === 0) {
        const fields = {
          charName: s.charName || '소금이',
          charAge: s.charAge || '5살',
          charGender: s.charGender || '중성',
          charHobby: s.charHobby || '새벽 반죽 냄새 맡기',
          charLook: s.charLook || '앞치마를 두른 통통한 곰. 둥근 눈, 밀색 털, 밀가루 묻은 베이지 앞치마.'
        };
        this.setState({ charCands: this.makeCands(), charSelected: -1 });
        this.propose('char', 'char', '말씀해주신 느낌으로 이렇게 채워봤어요. 확인을 누르면 캐릭터 정보에 반영할게요.', [
          { label: '이름', from: s.charName || '비어 있음', to: fields.charName },
          { label: '나이 · 성별', from: `${s.charAge || '비어 있음'} · ${s.charGender || '비어 있음'}`, to: `${fields.charAge} · ${fields.charGender}` },
          { label: '취미', from: s.charHobby || '비어 있음', to: fields.charHobby },
          { label: '외형', from: s.charLook || '비어 있음', to: fields.charLook }
        ], { fields, views: null, cands: true });
      } else {
        const nextLook = `${s.charLook || '앞치마를 두른 통통한 곰.'} 몸은 더 둥글게, 눈은 더 크게.`;
        this.propose('char', 'char', '말씀하신 대로 고쳐봤어요. 확인하면 외형과 4방향 이미지가 바뀝니다.', [
          { label: '외형', from: s.charLook || '비어 있음', to: nextLook }
        ], { fields: { charLook: nextLook }, views: this.makeViews() });
      }
    }, 650);
  }

  sendChar = () => {
    const text = this.state.charInput.trim();
    if (!text) return;
    this.setState(s => ({ charInput: '', charMsgs: [...s.charMsgs, { role: 'me', kind: 'text', text }] }));
    this.aiChar(text);
  };

  selectCand(i) {
    const views = this.makeViews();
    this.setState(s => ({
      charSelected: i, charViews: views,
      charMsgs: [...s.charMsgs,
        { role: 'me', kind: 'text', text: `${i + 1}번으로 할게요` },
        { role: 'ai', kind: 'text', text: `${i + 1}번으로 정했어요. 4방향으로 뽑아둘게요 — 확정하면 광고에 계속 쓰여요.` },
        { role: 'ai', kind: 'views', ref: 'views' }]
    }));

  resetSb(withTrend) {
    this.setState({
      sbMsgs: [{ role: 'ai', kind: 'text', text: withTrend
        ? '이 트렌드로 광고를 만들어볼게요. 먼저 — 오늘 생산한 품목이 있나요? 품목 이름과 수량을 말해주면 생산 기록으로 남겨둘게요.'
        : '광고를 만들기 전에 하나만요 — 오늘 생산한 품목이 있나요? 품목 이름과 수량을 말해주면 생산 기록으로 남겨둘게요.' }],
      sbTurn: 0, plan: [], comicCuts: [], sbProdLogged: false
    });
  }

  /* ---------- storyboard ---------- */
  aiSb(userText) {
    this.setState({ sbThinking: true });
    setTimeout(() => {
      const s = this.state;
      if (!s.sbProdLogged) {
        if (/안 ?했|없어|없습니다|안했|건너|아니/.test(userText || '')) {
          this.setState(st => ({
            sbThinking: false, sbProdLogged: true,
            sbMsgs: [...st.sbMsgs, { role: 'ai', kind: 'text', text: '알겠어요, 생산 기록은 넘어갈게요. 그럼 어떤 이야기로 광고를 만들까요?' }]
          }));
          return;
        }
        const name = this.itemFrom(userText);
        const qty = this.qtyFrom(userText);
        const day = dayFrom(userText);
        const isToday = day === isoDay(0);
        const id = Date.now();
        this.setState(st => ({
          sbThinking: false, sbProdLogged: true,
          items: st.items.includes(name) ? st.items : [...st.items, name],
          prods: [{ id, name, qty, date: day, time: timeFrom(userText), soldOut: '' }, ...st.prods],
          sbMsgs: [...st.sbMsgs,
            { role: 'ai', kind: 'text', text: `'${name}' 생산 기록을 ${fmtDay(day)}${isToday ? '(오늘)' : ''}로 남겼어요. 다르면 아래에서 바로 고쳐주세요. 매진 시각을 비워두면 알림으로 다시 물어볼게요.` },
            { role: 'ai', kind: 'prod', prodId: id },
            { role: 'ai', kind: 'text', text: `그럼 ${name} 이야기로 광고를 만들어볼까요? 알리고 싶은 걸 말해주세요.` }]
        }));
        return;
      }
      if (!s.plan.length) {
        const plan = BASE_PLAN.map(c => ({ ...c }));
        if (s.trendApplied) plan[2].line = `'${s.trendPick}' 밈을 그대로 따라 하는 손님 리액션 컷.`;
        this.propose('sb', 'plan', '이렇게 4컷으로 잡아봤어요. 확인을 누르면 스토리에 반영할게요.',
          plan.map(c => ({ label: `${c.n}컷`, from: '아직 없음', to: c.line })), { plan });
      } else if (!s.comicCuts.length) {
        const nextLine = '손님이 소금빵을 들고 과장되게 놀라는 컷 — 효과선 추가.';
        const plan = s.plan.map(c => c.n === 3 ? { ...c, line: nextLine } : c);
        this.propose('sb', 'plan', '3컷을 이렇게 바꿔볼게요. 확인하면 스토리가 바뀝니다.',
          [{ label: '3컷', from: (s.plan[2] && s.plan[2].line) || '없음', to: nextLine }], { plan });
      } else {
        const cuts = s.comicCuts.map(c => c.n === 2 ? { ...c, hue: rnd() } : c);
        this.propose('sb', 'comic', '2컷 그림을 다시 뽑아볼게요. 확인하면 그 컷만 교체됩니다.',
          [{ label: '2컷 그림', from: '지금 그림', to: '새로 뽑은 그림' }], { cuts });
      }
    }, 700);
  }

  sendSb = () => {
    const text = this.state.sbInput.trim();

    this.setState(s => ({ sbInput: '', sbMsgs: [...s.sbMsgs, { role: 'me', kind: 'text', text }] }));

    this.setState({ sbThinking: true });
    setTimeout(() => {
      const s = this.state;
      const base = rnd();
      const cuts = s.plan.map((c, i) => ({ n: c.n, short: c.short, line: c.line, hue: (base + i * 26) % 360 }));
      const existed = s.comicCuts.length > 0;
      this.propose('sb', 'comic',
        existed ? '스토리대로 네컷만화를 새로 그렸어요. 확인하면 기존 그림을 교체합니다.' : '스토리대로 네컷만화를 그렸어요. 확인하면 결과에 반영할게요.',
        cuts.map(c => ({ label: `${c.n}컷`, from: existed ? '지금 그림' : '아직 없음', to: c.line })),
        { cuts });
    }, 900);
  };

    const missingProds = s.prods.filter(p => !p.soldOut);
