<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    @font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2')}
    @font-face{font-family:'Pretendard';font-style:normal;font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2') format('woff2')}
    @font-face{font-family:'Pretendard';font-style:normal;font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2')}
    *{box-sizing:border-box}
    body{margin:0;background:#F6F8F9;color:#2B2F36;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
    input,textarea,select,button{font-family:inherit}
    input:focus,textarea:focus{outline:2px solid #CFEFE0;outline-offset:0}
    summary{list-style:none}
    summary::-webkit-details-marker{display:none}
    @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* 움직임을 줄이도록 설정한 기기에서는 회전·튀어나옴을 끈다 */
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <title>AI 광고 만들기</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
